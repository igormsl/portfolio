<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Агентство — проекты</title>
  <meta name="description" content="Видеопроекты для брендов и авторов. Кейсы, монтаж и AI-продакшн.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230e0e12'/%3E%3Cpath d='M12 36 24 10 36 36M17 27h14' fill='none' stroke='%23f0be5a' stroke-width='4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body id="top">
  <a class="skip-link" href="#projects">К проектам</a>
  <header class="site-header">
    <nav class="wrap nav" aria-label="Главная навигация">
      <a class="wordmark" href="#top">Агентство<span aria-hidden="true">.</span></a>
      <a class="nav-projects" href="#projects">Проекты</a>
      <a class="contact-link" href="#contact">Обсудить проект <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main class="wrap">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Видео · Монтаж · AI-продакшн</p>
      <h1 id="hero-title">Агентство<span aria-hidden="true">.</span></h1>
      <div class="hero-bottom">
        <p class="hero-line">Видеопроекты<br>для брендов и авторов.</p>
        <a class="text-link" href="#projects">Смотреть проекты <span aria-hidden="true">↓</span></a>
      </div>
    </section>
    <section class="projects" id="projects" aria-labelledby="projects-title">
      <div class="section-heading">
        <h2 id="projects-title">Проекты <span id="project-count"></span></h2>
        <button class="preview-toggle" id="preview-toggle" type="button" aria-pressed="false" hidden>Анимация превью</button>
      </div>
      <div id="project-list" aria-busy="true">
        <p class="status" role="status">Загружаем проекты…</p>
      </div>
      <noscript><p class="status">Чтобы посмотреть проекты и видео, включите JavaScript в браузере.</p></noscript>
    </section>
    <section class="contact" id="contact" aria-labelledby="contact-title">
      <p class="eyebrow">Ваш следующий проект</p>
      <h2 id="contact-title">Давайте <span>обсудим.</span></h2>
      <a class="button" href="https://t.me/igor_msl" target="_blank" rel="noopener noreferrer">Написать в Telegram <span aria-hidden="true">↗</span></a>
    </section>
    <footer><span>© 2026 Агентство</span><a href="#top">Наверх <span aria-hidden="true">↑</span></a></footer>
  </main>
  <dialog class="player" id="player" aria-labelledby="player-title">
    <div class="player-bar">
      <h2 id="player-title"></h2>
      <button class="close-player" id="close-player" type="button" aria-label="Закрыть видео" autofocus>×</button>
    </div>
    <video id="full-video" controls playsinline preload="none" controlslist="nodownload" disablepictureinpicture></video>
    <p class="player-error" id="player-error" role="alert" hidden>Не удалось воспроизвести видео. <button id="retry-video" type="button">Попробовать ещё раз</button></p>
  </dialog>
</body>
</html>
